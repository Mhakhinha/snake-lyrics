<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Lyrics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="juego">
    <div class="capa"></div>

    <header class="hud">
      <span id="titulo"></span>
      <span id="progreso"></span>
    </header>

    <!-- Reproductor de YouTube (la música de la canción) -->
    <div id="reproductor-caja"><div id="reproductor"></div></div>

    <!-- Pantalla de inicio -->
    <section id="inicio" class="pantalla">
      <h1>Snake Lyrics</h1>
      <p>Completa la letra y alimenta a la serpiente.<br>Acierta: nota musical. Falla: manzana podrida.</p>
      <input id="nombre" type="text" maxlength="20" placeholder="Escribe tu nombre" autocomplete="off">
      <button id="btnEmpezar" class="btn-grande">▶ Empezar</button>
    </section>

    <!-- Caja de letra (boceto: "LETRA CANCIÓN") -->
    <section id="caja-letra" class="oculto">
      <p id="frase">
        <span id="antes"></span>
        <span id="hueco">_____</span>
        <span id="despues"></span>
      </p>
      <div id="opciones"></div>
      <p id="mensaje" aria-live="polite"></p>
    </section>

    <!-- Pantalla final -->
    <section id="final" class="pantalla oculto">
      <h2>¡Fin de la canción!</h2>
      <p id="resultado"></p>
      <h3>🏆 Clasificación</h3>
      <ol id="ranking"></ol>
      <button id="btnRepetir" class="btn-grande">↻ Siguiente jugador</button>
      <button id="btnBorrar" class="btn-chico">Borrar clasificación</button>
    </section>

    <!-- Barra inferior (boceto: serpiente — manzana — línea — clave de sol) -->
    <footer id="barra">
      <div class="marcador malo">
        <svg viewBox="0 0 40 40" class="icono"><use href="#manzana"/></svg>
        <b id="fallos">0</b>
      </div>
      <div id="pista"><div id="carril"></div></div>
      <div class="marcador bueno">
        <svg viewBox="0 0 40 40" class="icono"><use href="#nota"/></svg>
        <b id="aciertos">0</b>
      </div>
    </footer>
  </main>

  <!-- Gráficos reutilizables -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Nota musical -->
      <symbol id="nota" viewBox="0 0 40 40">
        <path d="M16 6 L32 3 V26 a6 5 0 1 1 -3 -4.5 V11 L19 13 V30 a6 5 0 1 1 -3 -4.5 Z" fill="#ffd54a" stroke="#b8860b" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <!-- Manzana podrida -->
      <symbol id="manzana" viewBox="0 0 40 40">
        <path d="M20 12 C14 7 5 10 6 21 C7 31 14 37 20 34 C26 37 33 31 34 21 C35 10 26 7 20 12 Z" fill="#7a8a2e" stroke="#3e4a12" stroke-width="1.5"/>
        <path d="M12 18 C14 16 16 17 15 20 C14 23 11 22 12 18 Z" fill="#4a3216"/>
        <circle cx="25" cy="25" r="3.5" fill="#4a3216"/>
        <circle cx="21" cy="29" r="2" fill="#5c4420"/>
        <path d="M20 12 C20 8 21 5 24 3" stroke="#4a2f12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M24 5 C28 3 31 5 31 8 C27 9 25 8 24 5 Z" fill="#556b2f"/>
        <path d="M17 36 q1 4 -1 5" stroke="#9ab33a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <script src="letra.js"></script>
  <script src="script.js"></script>
</body>
</html>
